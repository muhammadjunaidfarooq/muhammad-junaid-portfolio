<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orbGrad" cx="35%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#e6ddff"/>
      <stop offset="30%" stop-color="hsl(258,90%,72%)"/>
      <stop offset="65%" stop-color="hsl(245,85%,55%)"/>
      <stop offset="100%" stop-color="hsl(230,70%,28%)"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#orbGrad)"/>
  <g stroke="url(#lineGrad)" stroke-width="1.3" fill="none" opacity="0.9">
    <line x1="30" y1="34" x2="50" y2="24"/>
    <line x1="50" y1="24" x2="70" y2="34"/>
    <line x1="30" y1="34" x2="44" y2="56"/>
    <line x1="70" y1="34" x2="56" y2="56"/>
    <line x1="44" y1="56" x2="56" y2="56"/>
    <line x1="44" y1="56" x2="50" y2="76"/>
    <line x1="56" y1="56" x2="50" y2="76"/>
    <line x1="50" y1="24" x2="50" y2="46"/>
    <line x1="50" y1="46" x2="44" y2="56"/>
    <line x1="50" y1="46" x2="56" y2="56"/>
  </g>
  <g fill="#fdfcff" filter="url(#glow)">
    <circle cx="30" cy="34" r="2.8"/>
    <circle cx="50" cy="24" r="3.2"/>
    <circle cx="70" cy="34" r="2.8"/>
    <circle cx="50" cy="46" r="2.6"/>
    <circle cx="44" cy="56" r="2.8"/>
    <circle cx="56" cy="56" r="2.8"/>
    <circle cx="50" cy="76" r="3.2"/>
  </g>
</svg>
